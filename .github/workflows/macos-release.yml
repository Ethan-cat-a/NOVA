name: macOS Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    if: startsWith(github.event.release.tag_name || inputs.release_tag, 'v')
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Verify the project version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);.*/\1/p' 'NOVA Copilot.xcodeproj/project.pbxproj' | tail -1)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $version" >&2
            exit 1
          fi

      - name: Build and package the universal Mac app
        run: bash scripts/package-macos-release.sh "$RUNNER_TEMP/nova-release" "$RUNNER_TEMP/nova-derived"

      - name: Upload the DMG and Sparkle archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/nova-release/NOVA-Copilot-${version}.dmg" \
            "$RUNNER_TEMP/nova-release/NOVA-Copilot-${version}.zip" \
            --clobber \
            --repo "$GH_REPO"
